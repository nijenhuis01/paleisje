<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paleisje">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Linda's Video Edit Paleisje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@700;900&family=Poppins:wght@600;800&family=Caveat:wght@700&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--panel:#16161c;--panel2:#1e1e26;--line:#2a2a34;--text:#ececf2;--mut:#8d8d9c;--acc:#ff5fa2;--acc2:#a78bfa;--acc3:#22d3ee;--vid:#1b3a4b;--txt:#4c2a85;--aud:#0f5040;--danger:#f43f5e;--tlh:300px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#40404e;background:#272731}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;font-weight:700}
button.primary:hover{filter:brightness(1.1)}
button.ghost{background:none;border-color:transparent}
button.danger{color:#ff8aa0}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:#101015;border:1px solid var(--line);border-radius:7px;padding:5px 7px}
textarea{width:100%;resize:vertical;min-height:60px}
input[type=range]{padding:0;accent-color:var(--acc);background:none;border:0;width:100%}
input[type=color]{padding:0;width:34px;height:26px;border-radius:6px;cursor:pointer}
a{color:var(--acc3)}
#app{display:grid;grid-template-rows:50px minmax(0,1fr) var(--tlh);grid-template-columns:minmax(0,1fr);height:100vh;width:100vw}
header{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:800;display:flex;align-items:center;gap:9px;font-size:14px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-size:14px}
.grow{flex:1}
#pname{width:170px;background:none;border-color:transparent}
#pname:hover,#pname:focus{border-color:var(--line)}
#workspace{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;min-height:0}
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
#left{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-radius:0;padding:8px 2px 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.tabs button span{font-size:17px;line-height:1}
.pbody{flex:1;overflow:auto;padding:12px}
.ph{font-weight:700;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.ph:first-child{margin-top:0}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:#08080b}
#previewWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden}
#cv{background:#000;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.5);touch-action:none;cursor:default}
#transport{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;border-top:1px solid var(--line);background:var(--panel)}
#time{font-variant-numeric:tabular-nums;color:var(--mut);min-width:130px;text-align:center}
#time b{color:var(--text)}
.playbtn{width:38px;height:34px;border-radius:50%;padding:0;font-size:15px}
/* media grid */
.drop{border:1.5px dashed #3a3a48;border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--text);background:rgba(255,95,162,.06)}
.drop b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mi{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#222 center/cover;cursor:pointer;border:1px solid var(--line)}
.mi:hover{border-color:var(--acc)}
.mi .d{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:5px;font-size:10.5px}
.mi .n{position:absolute;left:0;right:0;top:0;padding:3px 5px;font-size:10px;background:linear-gradient(rgba(0,0,0,.7),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .add{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;background:rgba(0,0,0,.45);opacity:0;transition:.15s}
.mi:hover .add{opacity:1}
.mi .x{position:absolute;left:4px;bottom:4px;width:20px;height:20px;border-radius:50%;padding:0;font-size:11px;background:rgba(0,0,0,.7);border:0;display:none}
.mi:hover .x{display:block}
.mi.err{outline:2px solid var(--danger)}
.mi .e{position:absolute;inset:auto 0 0 0;background:var(--danger);font-size:10px;padding:2px 4px;text-align:center}
.mi.aud{background:linear-gradient(135deg,#0f5040,#0b2f2a)}
.mi.aud .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;opacity:.8}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;font-size:11px;user-select:none}
.card:hover{border-color:var(--acc)}
.card.on{border-color:var(--acc);background:rgba(255,95,162,.12)}
.card .ico{font-size:20px;display:block;margin-bottom:3px}
.card canvas{width:100%;border-radius:6px;display:block;margin-bottom:4px;background:#222}
.track{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.track .sw{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:18px;flex:none}
.track .info{flex:1;min-width:0}
.track .info b{display:block;font-size:12.5px}
.track .info small{color:var(--mut);font-size:11px}
.track button{padding:5px 8px}
.emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.emoji button{font-size:24px;padding:6px 0;background:none;border-color:transparent}
.emoji button:hover{background:var(--panel2)}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tpl .card{padding:12px 4px;font-size:15px;background:#101015}
.note{color:var(--mut);font-size:11.5px;margin:8px 0}
.links a{display:block;margin:4px 0}
/* props */
.sec{border-bottom:1px solid var(--line);padding:10px 0}
.sec:first-child{padding-top:0}
.sech{font-weight:700;font-size:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.row{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.row .l{color:var(--mut)}
.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:11px}
.row2{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.row2 .l{color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{padding:5px 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:3px 7px;font-size:11px;border-radius:20px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:14px}
/* timeline */
#tl{min-width:0;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel);min-height:0}
#tlbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
#tlbar button{padding:5px 8px;font-size:12px}
#tlbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#zoom{width:110px}
#tlscroll{flex:1;overflow:auto;position:relative;min-height:0}
#tlinner{position:relative;min-height:100%;user-select:none}
.trow{display:flex;position:relative;border-bottom:1px solid #20202a}
.trow .hd{position:sticky;left:0;z-index:6;width:var(--head,96px);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--mut);font-size:11.5px}
.trow .ln{position:relative;flex:1}
#ruler .ln{height:24px;cursor:pointer;background:#121218}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid #33333f;font-size:10px;color:var(--mut);padding-left:3px;padding-top:2px}
.tick.s{top:16px}
.it{position:absolute;top:4px;bottom:4px;border-radius:7px;overflow:hidden;cursor:grab;border:1.5px solid rgba(255,255,255,.12);background-repeat:repeat-x;background-size:auto 100%;background-position:0 0}
.it.vid{background-color:var(--vid)}
.it.txt{background:var(--txt)}
.it.aud{background-color:var(--aud);background-repeat:no-repeat}
.it.sel{border-color:#fff;box-shadow:0 0 0 1px #fff;z-index:3}
.it .lbl{position:absolute;left:6px;top:3px;right:6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
.it .bd{position:absolute;right:5px;bottom:3px;font-size:10px;background:rgba(0,0,0,.6);padding:0 4px;border-radius:4px;pointer-events:none}
.it .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.it .h.l{left:0}.it .h.r{right:0}
.it.sel .h{background:rgba(255,255,255,.85)}
.it.sel .h::after{content:'';position:absolute;left:3px;top:35%;bottom:35%;width:2px;background:#333;border-radius:2px}
.it.dragging{opacity:.85;z-index:9;cursor:grabbing;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.trb{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:6px;padding:0;z-index:4;font-size:11px;background:#2a2a34;border:1px solid #555;transform:rotate(45deg);display:grid;place-items:center}
.trb span{transform:rotate(-45deg)}
.trb.on{background:var(--acc);border-color:#fff}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:8;pointer-events:none;margin-left:-1px}
#playhead::before{content:'';position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #fff}
.snapline{position:absolute;top:0;bottom:0;width:1px;background:var(--acc3);z-index:7;pointer-events:none}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px}
#modal h2{margin:0 0 10px;font-size:18px}
#modal h3{font-size:14px;margin:16px 0 6px}
#modal ol{padding-left:20px;margin:6px 0}
#modal li{margin:4px 0}
#modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#modal video{width:100%;max-height:50vh;background:#000;border-radius:8px}
.prog{height:8px;background:#2a2a34;border-radius:9px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#toast{position:fixed;left:50%;bottom:calc(var(--tlh) + 64px);transform:translateX(-50%) translateY(20px);background:#2b2b36;border:1px solid #444;padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:120;max-width:80vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:55vh;overflow:auto}
.prow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px}
.prow.cur{border-color:var(--acc)}
.prow .pt{width:54px;height:54px;border-radius:9px;background:#26262f center/cover;flex:none;display:grid;place-items:center;font-size:22px}
.prow .pi{flex:1;min-width:0}
.prow .pi input{width:100%;font-weight:700;background:transparent;border-color:transparent;padding:3px 4px}
.prow .pi input:focus{border-color:var(--line);background:#101015}
.prow .pi small{display:block;color:var(--mut);font-size:11px;padding-left:5px}
.prow .pb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.prow .pb button{padding:5px 8px;font-size:12px}
button.savebig{display:block;width:100%;padding:16px;font-size:18px;border-radius:14px;margin-top:6px}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}
#pool video,#pool audio{width:2px;height:2px}
/* splash */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#3b1747 0%,#120c1c 55%,#08080b 100%);transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .crown{font-size:58px;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(255,95,162,.5))}
#splash h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(26px,4.2vw,50px);margin:14px 20px 6px;text-align:center;background:linear-gradient(90deg,#ffd1e6,#ff5fa2,#c4b5fd,#ffd1e6);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
#splash p{color:#cbb8d8;margin:0 0 30px;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px}
#splash .bar{width:min(380px,70vw);height:10px;border-radius:10px;background:rgba(255,255,255,.09);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#splash .bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ff5fa2,#c084fc,#22d3ee);box-shadow:0 0 16px rgba(255,95,162,.7)}
#splash .pct{margin-top:10px;color:#a998b8;font-size:12px;font-variant-numeric:tabular-nums}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes shine{to{background-position:-300% 0}}
.sheetbar,#mnav{display:none}
#ruler .ln,.it.txt,.it.aud,.it .h{touch-action:none}
@media (max-width:820px){
 #app{grid-template-rows:calc(48px + env(safe-area-inset-top)) minmax(0,1fr) auto auto;height:100dvh}
 header{padding:env(safe-area-inset-top) 8px 0;gap:6px}
 header #pname,#bICloud,#bNew,.logo span.t,.bl2{display:none}
 #bProj{padding:6px 9px}
 #aspect{max-width:84px;padding:5px 4px}
 #bExport{padding:6px 10px}
 #workspace{display:block;position:relative}
 #stage{height:100%}
 #transport{padding:4px}
 #time{min-width:110px;font-size:12px}
 #left,#props{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));height:min(58dvh,560px);z-index:60;border:0;border-top:1px solid #3a3a48;border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .25s ease;box-shadow:0 -12px 40px rgba(0,0,0,.65)}
 #left.open,#props.open{transform:none}
 .sheetbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;border-bottom:1px solid var(--line)}
 .sheetbar b{font-size:15px}
 .sheetbar button{width:34px;height:34px;border-radius:50%;padding:0;font-size:15px}
 #left .tabs{display:none}
 #tlbar{padding:5px 6px;gap:4px;overflow-x:auto}
 #tlbar .bl,#tlbar .zl,#zoom{display:none}
 #tlbar button{padding:7px 10px;font-size:14px}
 #tlscroll{flex:none;height:178px;-webkit-overflow-scrolling:touch}
 .trow .hd{padding:0;justify-content:center;font-size:15px}
 .trow .hd .hl{display:none}
 .it .h{width:16px}
 .trb{top:13px;width:20px;height:20px;margin:-10px 0 0 -10px}
 .it .lbl{font-size:10px}
 #mnav{display:flex;position:relative;z-index:70;height:calc(62px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
 #mnav button{flex:1 0 auto;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;background:none;border:0;color:var(--mut);padding:4px 2px;position:relative}
 #mnav button span{font-size:19px;line-height:1.1}
 #mnav button.on{color:var(--text)}
 #mnav button.dot::after{content:'';position:absolute;top:2px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
 .mgrid{grid-template-columns:repeat(4,1fr)}
 .cards{grid-template-columns:repeat(4,1fr)}
 .emoji{grid-template-columns:repeat(8,1fr)}
 .mi .x{display:block}
 .mi .add{display:none}
 .row{grid-template-columns:90px 1fr 44px;margin:10px 0}
 input[type=range]{height:28px}
 #toast{bottom:calc(270px + env(safe-area-inset-bottom))}
 #modal{padding:10px;align-items:flex-end}
 #modal .box{border-radius:16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
 #splash h1{font-size:30px}
}
@media (max-width:1100px){#workspace{grid-template-columns:290px minmax(0,1fr) 260px}.logo span.t{display:none}}
</style>
</head>
<body>
<div id="splash"><div class="crown">👑</div><h1>Welkom bij Linda's video edit paleisje</h1><p>Je studio wordt klaargezet…</p><div class="bar"><i id="splashBar"></i></div><div class="pct" id="splashPct">0%</div></div>

<div id="app">
<header>
  <div class="logo"><i>👑</i><span class="t">Linda's Video Edit Paleisje</span></div>
  <input id="pname" value="Mijn project" title="Projectnaam">
  <div class="grow"></div>
  <button id="bUndo" title="Ongedaan maken (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Opnieuw (Ctrl+Shift+Z)">↷</button>
  <select id="aspect" title="Beeldverhouding">
    <option value="9:16">9:16 · TikTok/Reels</option><option value="16:9">16:9 · YouTube</option><option value="1:1">1:1 · Vierkant</option><option value="4:5">4:5 · Instagram</option><option value="4:3">4:3</option><option value="21:9">21:9 · Bioscoop</option>
  </select>
  <button id="bProj" title="Projecten openen en opslaan">📁<span class="bl2"> Projecten</span></button>
  <button id="bICloud">☁️ iCloud-hulp</button>
  <button id="bNew">Nieuw</button>
  <button id="bExport" class="primary">⬇ Exporteren</button>
</header>
<div id="workspace">
  <aside id="left" class="panel"><div class="sheetbar"><b id="leftTitle">Media</b><button onclick="closeSheets()" aria-label="Sluiten">✕</button></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="pbody" id="leftBody"></div>
  </aside>
  <section id="stage">
    <div id="previewWrap"><canvas id="cv"></canvas></div>
    <div id="transport">
      <button id="bStart" class="ghost" title="Naar begin">⏮</button>
      <button id="bBack" class="ghost" title="1 frame terug (←)">◀︎</button>
      <button id="bPlay" class="playbtn primary" title="Afspelen (spatie)">▶</button>
      <button id="bFwd" class="ghost" title="1 frame vooruit (→)">▶︎</button>
      <div id="time"><b>00:00.0</b> / 00:00.0</div>
    </div>
  </section>
  <aside id="props" class="panel"><div class="sheetbar"><b>Bewerken</b><button onclick="closeSheets()" aria-label="Sluiten">✕</button></div><div class="pbody" id="propsBody"></div></aside>
</div>
<section id="tl">
  <div id="tlbar">
    <button id="tSplit" title="Splitsen op afspeelkop (S)">✂<span class="bl"> Splitsen</span></button>
    <button id="tDup" title="Dupliceren (Ctrl+D)">⧉<span class="bl"> Dupliceren</span></button>
    <button id="tDel" title="Verwijderen (Delete)" class="danger">🗑<span class="bl"> Verwijderen</span></button>
